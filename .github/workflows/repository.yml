name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check public files and documentation
        shell: pwsh
        run: ./scripts/check-repository.ps1
